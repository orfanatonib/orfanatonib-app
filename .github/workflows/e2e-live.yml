# E2E full-stack (Playwright: app -> API -> MySQL/LocalStack), plano 02-e2e-fullstack, T6.2.
#
# ESTADO: OPCIONAL e MANUAL. Este workflow NÃO é gate de merge: só roda por `workflow_dispatch`
# (Actions > "E2E live" > Run workflow). Torná-lo obrigatório (branch protection, `pull_request`,
# `schedule` noturno) e criar o secret abaixo são decisões do solicitante/infra (regra 16) e não
# foram tomadas aqui. Para ativar o noturno, descomente o bloco `schedule`.
#
# Pré-requisitos (nada disso foi criado por este arquivo):
#   - secret `E2E_API_CHECKOUT_TOKEN`: PAT/deploy key com leitura em orfanatonib/orfanatonib-api
#     (o repositório da API é privado e o `GITHUB_TOKEN` deste repositório não o enxerga).
#   - runner com Docker (ubuntu-latest tem) para os serviços MySQL, LocalStack e DynamoDB Local.
#
# O que o job faz: sobe a pilha igual ao `./run.sh local` (API em :3000, app em :5173, MySQL,
# LocalStack com o bucket, DynamoDB Local), com `AI_PROVIDER_MODE=fake` (LLM nunca real),
# semeia as contas do E2E e roda os gates estáticos e o Playwright escolhido.
# E-mail: não há SMTP; a prova é a tabela `email_outbox` e as flags `email_*` ficam desligadas pelo
# projeto `setup`. Documentação dos helpers: e2e/live/README.md.
name: E2E live

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Projeto Playwright"
        type: choice
        default: live-api
        options: [live-api, live-ui, live-ui-mobile, todos]
      grep:
        description: "Filtro de título (--grep), ex.: [video-page. ou deixe vazio"
        type: string
        default: ""
      api_ref:
        description: "Branch/tag/SHA da API a testar"
        type: string
        default: main
  # schedule:
  #   - cron: "0 6 * * *"   # noturno (03:00 em Manaus) — só depois da decisão de infra

concurrency:
  group: e2e-live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: Gates estáticos (matriz, rotas, test-ids)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:test-ids
      - run: npm run check:scenarios
      - run: npm run check:routes
      - name: Testes dos helpers do E2E (Vitest)
        run: npx vitest run e2e/live/support

  e2e:
    name: Playwright (${{ inputs.project }})
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 90
    env:
      AI_PROVIDER_MODE: fake # a API recusa `fake` em produção; aqui nunca há provedor real
      CI: "true"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234 # igual ao env/local.env da API; banco efêmero do runner
          MYSQL_DATABASE: orfanato-nib-local
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot1234"
          --health-interval=5s --health-timeout=5s --health-retries=20
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports: ["4566:4566"]
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    steps:
      # A suíte espera os dois repositórios lado a lado (`../orfanatonib-api`).
      - uses: actions/checkout@v4
        with:
          path: orfanatonib-app
      - uses: actions/checkout@v4
        with:
          repository: orfanatonib/orfanatonib-api
          ref: ${{ inputs.api_ref }}
          token: ${{ secrets.E2E_API_CHECKOUT_TOKEN }}
          path: orfanatonib-api
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            orfanatonib-app/package-lock.json
            orfanatonib-api/package-lock.json

      - name: Bucket no LocalStack
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:4566/_localstack/health >/dev/null && break; sleep 2; done
          curl -sf -X PUT http://localhost:4566/orfanatos-nib-storage >/dev/null

      - name: API - instalar, migrar, subir
        working-directory: orfanatonib-api
        run: |
          npm ci
          npm run db:local:migration:deploy
          npm run dynamodb:local:ensure-table
          npm run build
          nohup npx dotenv -e env/local.env -- node dist/src/main.js > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health >/dev/null && exit 0; sleep 2; done
          echo "API não respondeu"; tail -n 80 ../api.log; exit 1

      - name: Semear contas e flags do E2E
        working-directory: orfanatonib-api
        run: npm run seed:local

      - name: App - instalar e subir
        working-directory: orfanatonib-app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx vite --port 5173 --strictPort > ../app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173 >/dev/null && exit 0; sleep 2; done
          echo "App não respondeu"; tail -n 80 ../app.log; exit 1

      - name: Playwright
        working-directory: orfanatonib-app
        env:
          PROJECT: ${{ inputs.project }}
          GREP: ${{ inputs.grep }}
        run: |
          args=(--config=playwright.live.config.ts)
          if [ "$PROJECT" != "todos" ]; then args+=(--project="$PROJECT"); fi
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Logs da pilha (em falha)
        if: failure()
        run: |
          echo "--- api.log"; tail -n 200 api.log || true
          echo "--- app.log"; tail -n 100 app.log || true

      - name: Artefatos do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: orfanatonib-app/e2e/.output-live
          if-no-files-found: ignore
